<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="スペシャルゲーム2026を楽しむための非公式マリーンズOB選手名鑑">
    <title>MARINES LEGENDS 2026</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <a class="skip-link" href="#players">選手一覧へ移動</a>
    <header class="site-header">
      <div class="site-header__inner">
        <p class="eyebrow">SPECIAL GAME 2026 / UNOFFICIAL GUIDE</p>
        <h1>MARINES <span>LEGENDS</span></h1>
        <a class="official-event-link" href="https://www.marines.co.jp/event/2026/specialgame/" target="_blank" rel="noopener noreferrer">スペシャルゲーム2026 公式サイト</a>
      </div>
    </header>

    <main>
      <section id="filter-panel" class="filters" aria-labelledby="filter-title" hidden>
        <div class="filters__heading">
          <h2 id="filter-title">選手を探す</h2>
          <p id="result-count" aria-live="polite"></p>
        </div>
        <div class="filter-block">
          <span class="filter-label" id="team-label">チーム</span>
          <div class="button-row" role="group" aria-labelledby="team-label">
            <button type="button" class="filter-button is-active" data-team-filter="ALL" aria-pressed="true">すべて</button>
            <button type="button" class="filter-button" data-team-filter="WHITE" aria-pressed="false">WHITE</button>
            <button type="button" class="filter-button" data-team-filter="BLACK" aria-pressed="false">BLACK</button>
          </div>
        </div>
        <label class="search-field">
          <span class="filter-label">選手名から検索</span>
          <input id="search" type="search" autocomplete="off" placeholder="名前・よみを入力">
        </label>
        <div class="filter-block">
          <span class="filter-label" id="position-label">守備位置</span>
          <div id="position-filters" class="button-row button-row--wrap" role="group" aria-labelledby="position-label"></div>
        </div>
      </section>

      <section class="roster" aria-labelledby="roster-title">
        <header class="roster__heading">
          <div>
            <p class="eyebrow">PLAYERS</p>
            <h2 id="roster-title">参加予定選手</h2>
          </div>
          <p>選手をタップして詳細を表示</p>
        </header>
        <div id="players" class="player-list" aria-busy="true"><p class="loading-note">選手データを読み込んでいます。</p></div>
        <div id="empty-state" class="empty-state" hidden>
          <p>該当する選手がいません。</p>
          <button id="reset-filters" type="button">条件をリセット</button>
        </div>
      </section>
    </main>

    <footer>
      <p>MARINES LEGENDS 2026 / UNOFFICIAL GUIDE</p>
      <p>球団非公式のファン制作名鑑です。参加予定は変更される場合があります。<a href="https://www.marines.co.jp/event/2026/specialgame/" target="_blank" rel="noopener noreferrer">最新の公式参加一覧</a>もご確認ください。</p>
    </footer>

    <script id="players-data" type="application/json"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
